<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <title>ArtFreq ad, hook A (9:16, 28 s)</title>
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* anymeansaudio.com's own type: Inter for text, DM Mono for small labels (files in assets/fonts). */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/inter-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "DM Mono";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/dm-mono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "DM Mono";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("assets/fonts/dm-mono-500.woff2") format("woff2");
      }

      /* The site's colours. Amber is the one accent: the website on the end card, nothing else. */
      :root {
        --bg: #0b0d12;
        --shot: #0a0c10;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f4f5f8;
        --body: #c3c8d2;
        --muted: #9097a6;
        --amber: #f9a13a;
        --frame-shadow: 0 50px 100px -40px rgba(0, 0, 0, 0.9), 0 20px 40px -24px rgba(0, 0, 0, 0.7);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
      }

      /* The plug-in's pictures. Each frame is a fixed place on the page for one way of looking at
         the real window; the shots (assets/video, cut by tools/cut_shots.py at these sizes, so a
         pixel of the shot is a pixel here) take turns inside it. The timeline shows a frame only
         while one of its shots plays. */
      .frame {
        position: absolute;
        overflow: hidden;
        background: var(--shot);
      }
      .frame .in {
        position: absolute;
        inset: 0;
      }
      #tall-in {
        height: 871px; /* the hook's picture: the pull-back turns about its top right corner */
      }
      .frame video {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* tall: the right end of the live view's plot, edge to edge (2 s across 1080 px) */
      #tall {
        left: 0;
        top: 614px;
        width: 1080px;
        height: 1306px;
        background: var(--bg);
        z-index: 1;
      }
      #tall::after {
        border-top: 2px solid var(--line);
      }
      #tall video {
        width: 1080px;
        height: 1306px;
      }
      /* the hook's shot holds 3 s: 1620 px wide, shown pulled back to 1080 (the timeline starts it closer) */
      #tall #hook-tall {
        height: 871px;
        box-shadow: 0 2px 0 var(--line);
      }

      /* card: ArtFreq's window from its left edge, running off the right of the page */
      #card {
        left: 40px;
        top: 660px;
        width: 1040px;
        height: 900px;
        border-radius: 28px 0 0 28px;
        box-shadow: var(--frame-shadow);
        opacity: 0;
        z-index: 2;
      }
      #card::after {
        border: 2px solid var(--line);
        border-right: 0;
        border-radius: 28px 0 0 28px;
      }
      #card video {
        width: 1040px;
        height: 900px;
      }

      /* fx: ArtFreq FX's whole window. #fx-pos is where it stands (it steps aside for the offer). */
      #fx-pos {
        position: absolute;
        left: 36px;
        top: 724px;
        width: 1008px;
        height: 616px;
        z-index: 5;
      }
      #fx {
        left: 0;
        top: 0;
        width: 1008px;
        height: 616px;
        border-radius: 28px;
        box-shadow: var(--frame-shadow);
        opacity: 0;
      }
      #fx::after {
        border: 2px solid var(--line);
        border-radius: 28px;
      }
      #fx video {
        width: 1008px;
        height: 616px;
      }

      /* zoom: the right end of ArtFreq FX's plot, from the left edge of the page, in place of the window */
      .zoom {
        left: 0;
        top: 724px;
        width: 944px;
        border-radius: 0 28px 28px 0;
        box-shadow: var(--frame-shadow);
        opacity: 0;
        z-index: 6;
      }
      .zoom::after {
        border: 2px solid var(--line);
        border-left: 0;
        border-radius: 0 28px 28px 0;
      }
      #zoom-1,
      #zoom-1 video {
        height: 570px;
      }
      #zoom-2,
      #zoom-2 video {
        height: 638px;
      }
      .zoom video {
        width: 944px;
      }

      /* the words on top: one scene per section (compositions/) */
      .scene {
        z-index: 10;
      }
      #offer {
        z-index: 4; /* under ArtFreq FX's window, which stays on through the offer */
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- ============ the plug-in, filmed (tools/adreel), silent here: the sound is #mix ============ -->

      <div id="tall" class="frame" data-layout-allow-overflow>
        <div id="tall-in" class="in">
          <!-- 0-2 s: "HEAR / THIS" whole on the first picture, and written again at "now" as it sounds -->
          <video id="hook-tall" class="clip" src="assets/video/hook-tall.mp4" data-start="0" data-duration="2" data-track-index="0" muted playsinline></video>
          <!-- 4-5.5 s: the typed words, played -->
          <video id="type-tall" class="clip" src="assets/video/type-tall.mp4" data-start="4" data-duration="1.5" data-track-index="0" muted playsinline></video>
          <!-- 6-7.5 s: the drawn star, played -->
          <video id="draw-tall" class="clip" src="assets/video/draw-tall.mp4" data-start="6" data-duration="1.5" data-track-index="0" muted playsinline></video>
          <!-- 8-10 s: the dropped picture, played -->
          <video id="picture-tall" class="clip" src="assets/video/picture-tall.mp4" data-start="8" data-duration="2" data-track-index="0" muted playsinline></video>
        </div>
      </div>

      <div id="card" class="frame" data-layout-allow-overflow>
        <!-- 2-3 s: the window, as the next pass starts -->
        <video id="hook-card" class="clip" src="assets/video/hook-card.mp4" data-start="2" data-duration="1" data-track-index="1" muted playsinline></video>
        <!-- 3-4 s: typing into the text box, the canvas following each key -->
        <video id="type-card" class="clip" src="assets/video/type-card.mp4" data-start="3" data-duration="1" data-track-index="1" muted playsinline></video>
        <!-- 5.5-6 s: the brush -->
        <video id="draw-card" class="clip" src="assets/video/draw-card.mp4" data-start="5.5" data-duration="0.5" data-track-index="1" muted playsinline></video>
        <!-- 7.5-8 s: a picture file dropped on the canvas and dragged out by its corners -->
        <video id="picture-card" class="clip" src="assets/video/picture-card.mp4" data-start="7.5" data-duration="0.5" data-track-index="1" muted playsinline></video>
      </div>

      <div id="fx-pos" data-layout-allow-overflow>
        <div id="fx" class="frame">
          <!-- 10-25 s: one take of ArtFreq FX on the loop. Each 4 s pass: the loop as it is, then
               the words: Carve + Draw (10-14 s), Carve (14-18 s), Carve + Draw from 18 s -->
          <video id="fx-card" class="clip" src="assets/video/fx-card.mp4" data-start="10" data-duration="15" data-track-index="0" muted playsinline></video>
        </div>
      </div>

      <!-- 12-14 s and 16-18 s: the same pictures of that take, closer on the words -->
      <div id="zoom-1" class="frame zoom" data-layout-allow-overflow>
        <video id="fx-zoom-1" class="clip" src="assets/video/fx-zoom-1.mp4" data-start="12" data-duration="2" data-track-index="1" muted playsinline></video>
      </div>
      <div id="zoom-2" class="frame zoom" data-layout-allow-overflow>
        <video id="fx-zoom-2" class="clip" src="assets/video/fx-zoom-2.mp4" data-start="16" data-duration="2" data-track-index="1" muted playsinline></video>
      </div>

      <!-- ============ the words ============ -->

      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="proof" class="scene" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="3" data-duration="7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="depth" class="scene" data-composition-id="depth" data-composition-src="compositions/depth.html" data-start="10" data-duration="10" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="offer" class="scene" data-composition-id="offer" data-composition-src="compositions/offer.html" data-start="20" data-duration="5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" class="scene" data-composition-id="end" data-composition-src="compositions/end.html" data-start="25" data-duration="3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- ============ the sound: the plug-in's own output and one drum loop (tools/mix_audio.py) ============ -->
      <audio id="mix" src="assets/audio/ad-mix.wav" data-start="0" data-duration="28" data-volume="1" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Which frame is on screen when (seconds). Every change is a hard cut on a beat (120 BPM).
      const show = (id, from, to) => {
        tl.set(id, { opacity: 1 }, from);
        tl.set(id, { opacity: 0 }, to);
      };
      tl.set("#tall", { opacity: 0 }, 2);
      show("#card", 2, 4);
      show("#tall", 4, 5.5);
      show("#card", 5.5, 6);
      show("#tall", 6, 7.5);
      show("#card", 7.5, 8);
      show("#tall", 8, 10);
      show("#fx", 10, 12);
      show("#zoom-1", 12, 14);
      show("#fx", 14, 16);
      show("#zoom-2", 16, 18);
      show("#fx", 18, 25);

      // The first picture is the live view close on the words; it pulls back from "now" (its top
      // right corner) to hold three seconds, where the words are written again as they sound.
      tl.fromTo(
        "#tall-in",
        { scale: 1.4, transformOrigin: "100% 0%" },
        { scale: 1, duration: 0.45, ease: "expo.out" },
        0,
      );

      // Each cut lands a little large and settles: a window as a whole, an edge-to-edge
      // picture inside its frame.
      const land = (id, at, origin) =>
        tl.fromTo(
          id,
          { scale: 1.035, transformOrigin: origin },
          { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false },
          at,
        );
      land("#card", 2, "0% 50%");
      land("#card", 3, "0% 50%");
      land("#tall-in", 4, "50% 50%");
      land("#card", 5.5, "0% 50%");
      land("#tall-in", 6, "50% 50%");
      land("#card", 7.5, "0% 50%");
      land("#tall-in", 8, "50% 50%");
      land("#fx", 10, "50% 50%");
      land("#zoom-1", 12, "0% 50%");
      land("#fx", 14, "50% 50%");
      land("#zoom-2", 16, "0% 50%");
      land("#fx", 18, "50% 50%");

      // 20 s: on the cut, ArtFreq FX's window (still playing) stands beside ArtFreq's for the offer.
      tl.set("#fx-pos", { x: 404, y: 176, scale: 600 / 1008, transformOrigin: "0% 0%" }, 20);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
