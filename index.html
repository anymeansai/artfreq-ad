<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <title>ArtFreq ad, hook A (9:16, 28 s)</title>
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* anymeansaudio.com's own type: Inter for text, DM Mono for small labels (files in assets/fonts). */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/inter-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "DM Mono";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/dm-mono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "DM Mono";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("assets/fonts/dm-mono-500.woff2") format("woff2");
      }

      /* The site's colours. Amber is the one accent: the prices and the website, nothing else. */
      :root {
        --bg: #0b0d12;
        --shot: #0a0c10;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f4f5f8;
        --body: #c3c8d2;
        --muted: #9097a6;
        --amber: #f9a13a;
        --frame-shadow: 0 50px 100px -40px rgba(0, 0, 0, 0.9), 0 20px 40px -24px rgba(0, 0, 0, 0.7);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
      }

      /* The plug-in's pictures. Each frame is a fixed place on the page for one way of looking at
         the real window; the shots (assets/video, cut by tools/cut_shots.py at these sizes, so a
         pixel of the shot is a pixel here) take turns inside it. The timeline shows a frame only
         while one of its shots plays. */
      .frame {
        position: absolute;
        overflow: hidden;
        background: var(--shot);
      }
      .frame .in {
        position: absolute;
        inset: 0;
      }
      .frame video {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* tall: the right end of the live view's plot, edge to edge (2 s, or 1.5 s, across 1080 px) */
      #tall {
        left: 0;
        top: 614px;
        width: 1080px;
        height: 1306px;
        z-index: 1;
      }
      #tall::after {
        border-top: 2px solid var(--line);
      }
      #tall video {
        width: 1080px;
        height: 1306px;
      }

      /* card: ArtFreq's window from its left edge, running off the right of the page */
      #card {
        left: 40px;
        top: 660px;
        width: 1040px;
        height: 900px;
        border-radius: 28px 0 0 28px;
        box-shadow: var(--frame-shadow);
        opacity: 0;
        z-index: 2;
      }
      #card::after {
        border: 2px solid var(--line);
        border-right: 0;
        border-radius: 28px 0 0 28px;
      }
      #card video {
        width: 1040px;
        height: 900px;
      }

      /* fx: ArtFreq FX's whole window */
      #fx {
        left: 36px;
        top: 724px;
        width: 1008px;
        height: 616px;
        border-radius: 28px;
        box-shadow: var(--frame-shadow);
        opacity: 0;
        z-index: 5;
      }
      #fx::after {
        border: 2px solid var(--line);
        border-radius: 28px;
      }
      #fx video {
        width: 1008px;
        height: 616px;
      }

      /* zoom: the right end of ArtFreq FX's plot, edge to edge, over the window */
      #zoom {
        left: 0;
        top: 724px;
        width: 1080px;
        height: 900px;
        background: transparent;
        z-index: 6;
      }
      #fx-zoom-1 {
        width: 1080px;
        height: 900px;
      }
      #fx-zoom-2 {
        width: 1080px;
        height: 804px;
      }

      /* the words on top: one scene per section (compositions/) */
      .scene {
        z-index: 10;
      }
      #offer {
        z-index: 4; /* under ArtFreq FX's window, which stays on through the offer */
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- ============ the plug-in, filmed (tools/adreel), silent here: the sound is #mix ============ -->

      <div id="tall" class="frame" data-layout-allow-overflow>
        <div id="tall-in" class="in">
          <!-- 0-1 s: "HEAR / THIS" half written and sounding, the rest arriving at "now" -->
          <video id="hook-tall" class="clip" src="assets/video/hook-tall.mp4" data-start="0" data-duration="1" data-track-index="0" muted playsinline></video>
          <!-- 4-5.5 s: the typed words, played -->
          <video id="type-tall" class="clip" src="assets/video/type-tall.mp4" data-start="4" data-duration="1.5" data-track-index="0" muted playsinline></video>
          <!-- 6-7.5 s: the drawn star, played -->
          <video id="draw-tall" class="clip" src="assets/video/draw-tall.mp4" data-start="6" data-duration="1.5" data-track-index="0" muted playsinline></video>
          <!-- 8-10 s: the dropped picture, played -->
          <video id="picture-tall" class="clip" src="assets/video/picture-tall.mp4" data-start="8" data-duration="2" data-track-index="0" muted playsinline></video>
        </div>
      </div>

      <div id="card" class="frame" data-layout-allow-overflow>
        <div id="card-in" class="in">
          <!-- 1-3 s: the window, the second pass writing the words again -->
          <video id="hook-card" class="clip" src="assets/video/hook-card.mp4" data-start="1" data-duration="2" data-track-index="1" muted playsinline></video>
          <!-- 3-4 s: typing into the text box, the canvas following each key -->
          <video id="type-card" class="clip" src="assets/video/type-card.mp4" data-start="3" data-duration="1" data-track-index="1" muted playsinline></video>
          <!-- 5.5-6 s: the brush -->
          <video id="draw-card" class="clip" src="assets/video/draw-card.mp4" data-start="5.5" data-duration="0.5" data-track-index="1" muted playsinline></video>
          <!-- 7.5-8 s: a picture file dropped on the canvas -->
          <video id="picture-card" class="clip" src="assets/video/picture-card.mp4" data-start="7.5" data-duration="0.5" data-track-index="1" muted playsinline></video>
        </div>
      </div>

      <div id="fx" class="frame" data-layout-allow-overflow>
        <div id="fx-in" class="in">
          <!-- 10-25 s: one take of ArtFreq FX on the loop: as it is, then Carve, then Carve + Draw -->
          <video id="fx-card" class="clip" src="assets/video/fx-card.mp4" data-start="10" data-duration="15" data-track-index="0" muted playsinline></video>
        </div>
      </div>

      <div id="zoom" class="frame" data-layout-allow-overflow>
        <div id="zoom-in" class="in">
          <!-- 12-14 s and 16-18 s: the same pictures of that take, closer on the words -->
          <video id="fx-zoom-1" class="clip" src="assets/video/fx-zoom-1.mp4" data-start="12" data-duration="2" data-track-index="1" muted playsinline></video>
          <video id="fx-zoom-2" class="clip" src="assets/video/fx-zoom-2.mp4" data-start="16" data-duration="2" data-track-index="1" muted playsinline></video>
        </div>
      </div>

      <!-- ============ the words ============ -->

      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="proof" class="scene" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="3" data-duration="7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="depth" class="scene" data-composition-id="depth" data-composition-src="compositions/depth.html" data-start="10" data-duration="10" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="offer" class="scene" data-composition-id="offer" data-composition-src="compositions/offer.html" data-start="20" data-duration="5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" class="scene" data-composition-id="end" data-composition-src="compositions/end.html" data-start="25" data-duration="3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- ============ the sound: the plug-in's own output and one drum loop (tools/mix_audio.py) ============ -->
      <audio id="mix" src="assets/audio/ad-mix.wav" data-start="0" data-duration="28" data-volume="1" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Which frame is on screen when (seconds). Every change is a hard cut on a beat (120 BPM).
      const show = (id, from, to) => {
        tl.set(id, { opacity: 1 }, from);
        tl.set(id, { opacity: 0 }, to);
      };
      tl.set("#tall", { opacity: 0 }, 1);
      show("#card", 1, 4);
      show("#tall", 4, 5.5);
      show("#card", 5.5, 6);
      show("#tall", 6, 7.5);
      show("#card", 7.5, 8);
      show("#tall", 8, 10);
      show("#fx", 10, 25);

      // Each cut lands a little large and settles (the picture inside the frame, not the frame).
      const land = (id, at, from = 1.035) =>
        tl.fromTo(id, { scale: from }, { scale: 1, duration: 0.3, ease: "expo.out" }, at);
      land("#tall-in", 0, 1.06);
      land("#card-in", 1);
      land("#card-in", 3);
      land("#tall-in", 4);
      land("#card-in", 5.5);
      land("#tall-in", 6);
      land("#card-in", 7.5);
      land("#tall-in", 8);
      land("#fx-in", 10);
      land("#zoom-in", 12);
      land("#zoom-in", 16);

      // 20 s: ArtFreq FX's window, still playing, steps down beside ArtFreq's for the offer.
      tl.fromTo(
        "#fx",
        { x: 0, y: 0, scale: 1, transformOrigin: "0% 0%" },
        { x: 404, y: 156, scale: 600 / 1008, duration: 0.5, ease: "power3.inOut", immediateRender: false },
        20,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
