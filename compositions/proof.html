  <div id="root" data-composition-id="proof" data-width="1080" data-height="1920">
    <!-- Said in four cuts: each part arrives with its shot (3 s, 5.5 s, 7.5 s and 8.5 s of the ad). -->
    <div id="proof-line" class="clip" data-start="0" data-duration="7" data-track-index="0">
      <span id="proof-w1">Type it.</span>
      <span id="proof-w2">Draw it.</span>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Each part is sharp on its cut and settles from a little large; then it holds still.
    const land = (id, at) => {
      tl.set(id, { opacity: 1 }, at);
      tl.fromTo(
        id,
        { scale: 1.07, transformOrigin: "0% 60%" },
        { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false },
        at,
      );
    };
    tl.fromTo("#proof-w1", { scale: 1.07, transformOrigin: "0% 60%" }, { scale: 1, duration: 0.3, ease: "expo.out" }, 0);
    land("#proof-w2", 2.5);
    land("#proof-w3", 4.5);
    land("#proof-w4", 5.5);
    window.__timelines["proof"] = tl;
  </script>
