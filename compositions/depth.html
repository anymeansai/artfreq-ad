<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #depth-line {
      position: absolute;
      left: 120px;
      top: 296px;
      width: 840px;
      font-family: "Inter", sans-serif;
      font-weight: 650;
      font-size: 104px;
      line-height: 1;
      letter-spacing: -0.045em;
      color: #f4f5f8;
    }
    #depth-line span {
      display: block;
      white-space: nowrap;
    }
    /* What is being heard right now, in the window's own names for its modes. */
    #depth-steps {
      position: absolute;
      left: 120px;
      top: 646px;
      width: 840px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: "DM Mono", monospace;
      font-weight: 500;
      font-size: 38px;
      line-height: 48px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9097a6;
      white-space: nowrap;
    }
    #depth-steps i {
      display: block;
      width: 30px;
      height: 2px;
      background: rgba(255, 255, 255, 0.22);
    }
    #depth-s1 {
      color: #f4f5f8; /* the section starts on the loop as it is */
    }
    #depth-s2 {
      word-spacing: -0.3em; /* "Carve + Draw" reads as one step */
    }
  </style>
  <div id="root" data-composition-id="depth" data-width="1080" data-height="1920">
    <div id="depth-line" class="clip" data-start="0" data-duration="10" data-track-index="0">
      <span id="depth-l1">Or carve it</span>
      <span id="depth-l2">into audio</span>
      <span id="depth-l3">you already have.</span>
    </div>
    <div id="depth-steps" class="clip" data-start="0" data-duration="10" data-track-index="1">
      <span id="depth-s1">Dry</span><i></i><span id="depth-s2">Carve + Draw</span><i></i><span id="depth-s3">Carve</span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // The line is sharp on the cut and settles from a little large; then it holds still.
    tl.fromTo("#depth-line", { scale: 1.05, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.3, ease: "expo.out" }, 0);

    // The step that is true of the sound now is white; the others wait in grey. Each pass of
    // the drawing (4 s) starts with a rest, where the loop comes out as it went in, then the
    // words (1.2 s in). Mode: Carve + Draw for the first pass, Carve for the second, then
    // Carve + Draw again.
    const on = "#f4f5f8", off = "#9097a6";
    const light = (id, at) => tl.set(id, { color: on }, at);
    const dim = (id, at) => tl.set(id, { color: off }, at);
    dim("#depth-s1", 1.2);  light("#depth-s2", 1.2);   // the words begin: Carve + Draw
    dim("#depth-s2", 4);    light("#depth-s1", 4);     // next pass: the rest
    dim("#depth-s1", 5.2);  light("#depth-s3", 5.2);   // the words begin: Carve
    dim("#depth-s3", 8);    light("#depth-s1", 8);     // next pass: the rest
    dim("#depth-s1", 9.2);  light("#depth-s2", 9.2);   // the words begin: Carve + Draw
    window.__timelines["depth"] = tl;
  </script>
</template>
